<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" fill="none">
  <!-- Hi-Volt Engineering Solutions Logo -->
  <defs>
    <linearGradient id="voltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(15, 10)">
    <path d="M40 5 L70 20 V50 C70 68 55 80 40 85 C25 80 10 68 10 50 V20 Z" fill="#0B172A" stroke="url(#voltGrad)" stroke-width="3" />
    <path d="M22 28 H58" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <path d="M25 38 H55" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <path d="M43 14 L24 45 H38 L33 74 L57 39 H41 Z" fill="url(#sparkGrad)" filter="url(#glow)" />
    <circle cx="40" cy="14" r="2.5" fill="#FFFBEB" />
  </g>

  <g transform="translate(100, 20)">
    <text x="0" y="32" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="#0B172A">
      HI<tspan fill="#0284C7">-</tspan><tspan fill="#0284C7">VOLT</tspan>
    </text>
    <path d="M165 14 L160 25 H166 L162 34 L171 23 H166 Z" fill="#F59E0B" />
    <text x="0" y="52" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="700" font-size="13" letter-spacing="4.5" fill="#475569">
      ENGINEERING SOLUTIONS
    </text>
    <text x="0" y="66" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="500" font-size="9" letter-spacing="1.5" fill="#0284C7">
      HIGH VOLTAGE TEST &amp; MEASURING SYSTEMS
    </text>
  </g>
</svg>
